# Render's free plan puts the service to sleep after 15 minutes without traffic,
# and the next visitor waits ~30–60 s for a cold start. Pinging the health check
# every 10 minutes keeps the demo instance warm.
name: Keep Render demo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 15 --retry-all-errors \
            --max-time 90 https://bookleaf-support-portal-scjv.onrender.com/api/health
