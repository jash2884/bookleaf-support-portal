# Render Blueprint: one Docker web service + managed Postgres.
# Deploy: Render dashboard → New → Blueprint → select this repo, then set ANTHROPIC_API_KEY.
services:
  - type: web
    name: bookleaf-support-portal
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bookleaf-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false # entered in the dashboard; never committed
      - key: AI_TRIAGE_MODEL
        value: claude-haiku-5-5
      - key: AI_DRAFT_MODEL
        value: claude-opus-5-5

databases:
  - name: bookleaf-db
    plan: free
    databaseName: bookleaf
    user: bookleaf
