# Render Blueprint: one Docker web service + managed Postgres.
# Deploy: Render dashboard → New → Blueprint → select this repo, then set GEMINI_API_KEY (or ANTHROPIC_API_KEY).
services:
  - type: web
    name: bookleaf-support-portal
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bookleaf-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false # entered in the dashboard; never committed
      - key: ANTHROPIC_API_KEY
        sync: false # optional: set AI_PROVIDER=anthropic to use Claude instead

databases:
  - name: bookleaf-db
    plan: free
    databaseName: bookleaf
    user: bookleaf
