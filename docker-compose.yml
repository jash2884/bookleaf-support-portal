# Local development: `docker compose up -d db` starts only Postgres.
# Full stack in containers: `docker compose up --build` (app on http://localhost:4000).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bookleaf
      POSTGRES_PASSWORD: bookleaf
      POSTGRES_DB: bookleaf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookleaf"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bookleaf:bookleaf@db:5432/bookleaf?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-32chars}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NODE_ENV: production
      PORT: 4000
    ports:
      - "4000:4000"
    profiles: ["full"]

volumes:
  pgdata:
